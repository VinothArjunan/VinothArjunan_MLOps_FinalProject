name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # =============================
  # JOB 1: Build & Push Image
  # =============================
  build:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build API Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vinotharjunan-mlops830api:latest -f docker/Dockerfile.api .

      - name: Build UI Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vinotharjunan-mlops830ui:latest -f docker/Dockerfile.ui .

      - name: Push API image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vinotharjunan-mlops830api:latest

      - name: Push UI image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vinotharjunan-mlops830ui:latest

  # =============================
  # JOB 2: Deploy to Kubernetes
  # =============================
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # Setup kubeconfig
      # -----------------------------
      - name: Setup kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config
          export KUBECONFIG=~/.kube/config

      # -----------------------------
      # Show decoded kubeconfig (NEW)
      # -----------------------------
      - name: Show decoded kubeconfig
        run: |
          echo "===== DECODED FILE ====="
          sed -n '1,200p' ~/.kube/config

      # -----------------------------
      # Debug kubeconfig
      # -----------------------------
      - name: Debug kubeconfig
        env:
          KUBECONFIG: ~/.kube/config
        run: |
          echo "----- contexts -----"
          kubectl config get-contexts || true
          echo "----- current context -----"
          kubectl config current-context || true

      # -----------------------------
      # Verify cluster connectivity
      # -----------------------------
      - name: Verify Kubernetes connection
        env:
          KUBECONFIG: ~/.kube/config
        run: |
          kubectl cluster-info
          kubectl get nodes

      # -----------------------------
      # Deploy to Kubernetes
      # -----------------------------
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ~/.kube/config
        run: |
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/ui-deployment.yaml
          kubectl rollout status deployment/api-deployment

          kubectl rollout status deployment/ui-deployment
